[build-system]
requires = [
  "setuptools>=80",
  "setuptools-scm[simple]>=9.2",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "kitteng2p"
dynamic = ["version"]
description = "Independent KittenTTS-compatible eSpeak/phoneme/token-id frontend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "kitteng2p contributors"}]
keywords = ["tts", "kitten", "kittentts", "g2p", "phonemizer", "espeak", "onnx"]
dependencies = [
  "espeakng-runtime>=0.1.5,<0.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
bundled = ["espeakng-runtime[bundled]>=0.1.5,<0.2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "mypy>=1.11",
  "build>=1",
  "twine>=5",
  "packaging>=24",
]

[project.urls]
Repository = "https://github.com/buchwandler/kitteng2p"
Homepage = "https://github.com/buchwandler/kitteng2p"

[project.scripts]
kitteng2p = "kitteng2p.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kitteng2p*"]

[tool.setuptools.package-data]
kitteng2p = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.1.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "espeak: tests requiring eSpeak",
  "integration: integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["kitteng2p"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
